<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="たしざん">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF5E9">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>たしざん</title>

</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* layout: full-screen picture-book app for iPad mini. Portrait = stacked; landscape = stage left / answers right.
   Single warm paper look on purpose (a picture book doesn't switch to dark). */
:root{
  --paper:#FBF5E9; --card:#FFFCF5; --ink:#4A3A2E; --soft:#8A7765; --line:#D9C7AA;
  --red:#DE6A4F; --red2:#F08C72; --blue:#4F84C4; --blue2:#79A6DB;
  --butter:#F3CB5A; --butter2:#FFF0C2; --sage:#9DBE8C; --ok:#5FA36A; --pink:#F2A7A0;
  --hand:"Klee One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --wob:22px 18px 24px 16px / 16px 24px 18px 22px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--round);background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .33 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:var(--round);color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
#card{flex:1;min-height:0;overflow-y:auto;padding-block:8px 20px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:10px 4px;min-height:52px}
.top h1{font-family:var(--hand);font-size:clamp(1.3rem,3.4vmin,1.9rem);margin:0;flex:1;text-wrap:balance}
.ibtn{flex:none;width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);font-size:1.5rem;display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn.small{width:42px;height:42px;font-size:1.15rem;border-width:2px;color:var(--soft);border-color:var(--line)}
.pill{font-family:var(--hand);font-size:1.05rem;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;white-space:nowrap}
.prog{flex:1;display:flex;gap:8px;justify-content:center}
.prog i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.prog i.d{background:var(--butter);border-color:#D9A93A}

/* sketchy containers */
.sketch{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob)}

/* ten-frame */
.frames{--c:clamp(34px,min(11vw,10vh),92px);display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.frames.two{--c:clamp(26px,min(calc((100vw - 170px)/10.4),7vh),66px)}
.tf{display:grid;grid-template-columns:repeat(5,var(--c));gap:calc(var(--c)*.12);padding:calc(var(--c)*.16);background:var(--card);border:3px solid var(--ink);border-radius:var(--wob);position:relative}
.tf.target{box-shadow:0 0 0 6px var(--butter2),0 0 0 9px var(--butter)}
.cell{width:var(--c);height:var(--c);border-radius:28%;border:2px dashed #CDB894;box-sizing:border-box;display:grid;place-items:center;position:relative;background:#FFFDF8}
.cell.hint{background:var(--butter2);border:2.5px solid var(--butter)}
.cell .n{font-family:var(--hand);font-size:calc(var(--c)*.36);color:var(--soft)}
.dot{width:84%;height:84%;border-radius:48% 52% 50% 50% / 52% 48% 52% 48%}
.dot.r{background:radial-gradient(circle at 34% 30%,var(--red2),var(--red) 62%,#C4573F)}
.dot.b{background:radial-gradient(circle at 34% 30%,var(--blue2),var(--blue) 62%,#3E6FAC)}
.dot.x{background:transparent;border:3px dashed var(--red);box-sizing:border-box;display:grid;place-items:center;color:var(--red);font-weight:900;font-size:calc(var(--c)*.42)}
.dot.x::after{content:"×";line-height:1}
.dot.pop{animation:pop .4s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.frames.yay .dot:not(.x){animation:hop .5s ease calc(var(--i,0)*35ms)}
@keyframes hop{40%{transform:translateY(-22%) scale(1.06)}}
.tf.mini{--c:16px;border-width:2px;gap:2px;padding:4px}
.tf.mini .cell{border-width:1px;border-radius:30%}

/* question screen */
.qs{flex:1;display:grid;grid-template-rows:auto auto 1fr;gap:14px;align-content:start}
.stage{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,22px)}
.side{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px)}
.eq{font-family:var(--hand);font-size:clamp(2.6rem,8vmin,5rem);line-height:1.1;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq .op{font-family:var(--round);font-weight:700;color:var(--ink)}
.eq .r{color:var(--red)} .eq .b{color:var(--blue)}
.q{font-family:var(--hand);font-size:clamp(1.4rem,4vmin,2.2rem);text-align:center;margin:0;line-height:1.4;min-height:1.4em}
.hidebox{display:grid;place-items:center;min-height:calc(var(--c)*2.6)}
.hidebox .peek{font-family:var(--hand);font-size:calc(var(--c)*1.4);color:var(--soft)}
.answers{--a:clamp(76px,min(17vw,15vh),140px);display:flex;gap:clamp(18px,4vw,36px);justify-content:center;flex-wrap:wrap}
.abtn{font-family:var(--hand);font-size:calc(var(--a)*.46);width:var(--a);height:var(--a);border-radius:var(--wob);border:3px solid var(--ink);background:var(--card);cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 5px 0 var(--line);transition:transform .08s}
.abtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.abtn.ok{background:var(--sage);border-color:#55804A;color:#fff;box-shadow:0 5px 0 #6E9461}
.abtn.no{animation:shake .4s}
.abtn:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* coach: the bear + speech bubble */
.coach{display:flex;align-items:flex-end;gap:10px;min-height:clamp(90px,14vmin,130px);width:100%;max-width:560px}
.bear{flex:none;width:clamp(80px,13vmin,124px);transition:transform .3s}
.bear svg{display:block;width:100%;height:auto}
.bear.bounce{animation:bob .6s ease}
@keyframes bob{30%{transform:translateY(-12px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.bubble{position:relative;flex:1;font-family:var(--hand);font-size:clamp(1.15rem,3.2vmin,1.6rem);line-height:1.45;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);padding:10px 16px;margin-bottom:22px;min-height:1.45em}
.bubble::before{content:"";position:absolute;left:-12px;bottom:14px;width:18px;height:18px;background:var(--card);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.bubble:empty{visibility:hidden}
.bubble.good{color:#3F7A49}

/* home */
.home{display:grid;gap:16px}
.island{display:flex;flex-direction:column;align-items:center;gap:8px}
.iname{font-family:var(--hand);font-size:clamp(1.15rem,3vmin,1.5rem);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.board{--s:clamp(48px,min(12vw,8.5vh),80px);display:grid;grid-template-columns:repeat(5,var(--s));gap:10px;padding:12px;background:var(--butter2);border:2.5px dashed #D9A93A;border-radius:var(--wob)}
.sq{width:var(--s);height:var(--s);border-radius:var(--wob);background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:calc(var(--s)*.55);position:relative;padding:0;cursor:default}
.sq.done{cursor:pointer;border-color:#D9A93A}
.sq.today{border:3px solid var(--blue);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(79,132,196,.25)}}
.sq .num{position:absolute;left:5px;top:2px;font-family:var(--hand);font-size:.75rem;color:var(--soft)}
.sq .hana{position:absolute;right:-7px;bottom:-7px;font-size:1.2rem}
.sq.placed{animation:stick .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes stick{from{transform:scale(1.9) rotate(-20deg);opacity:.2}to{transform:none;opacity:1}}
.isles{display:flex;gap:6px}
.isles i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.isles i.d{background:var(--butter)} .isles i.c{background:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:14px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);cursor:pointer;box-shadow:0 5px 0 var(--line);min-height:96px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile .no{position:absolute;top:-12px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--hand);font-size:1.1rem;display:grid;place-items:center;border:2px solid var(--ink)}
.tile .t{font-family:var(--hand);font-size:clamp(1.05rem,2.8vmin,1.4rem);line-height:1.35;min-width:0}
.tile.rec{background:var(--butter2);box-shadow:0 0 0 4px var(--butter),0 5px 0 var(--line)}
.tile.rec::after{content:"きょうは これ！";position:absolute;top:-14px;right:10px;background:var(--red);color:#fff;font-family:var(--hand);font-size:.95rem;padding:2px 12px;border-radius:999px;border:2px solid var(--ink)}
.tile.lock{cursor:default;background:#F6EFE2;border-style:dashed;border-color:var(--line);box-shadow:none;color:var(--soft)}
.tile.lock .no{background:var(--line)}
.tile.lock .tf{opacity:.35}
.tile .lk{font-size:.85rem;font-family:var(--round)}

/* buttons */
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pbtn{font-family:var(--hand);font-size:clamp(1.2rem,3.4vmin,1.6rem);border:3px solid var(--ink);border-radius:999px;padding:12px 30px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 5px 0 #3E6FAC}
.pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #3E6FAC}
.pbtn.sub{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.pbtn.sun{background:var(--butter);color:var(--ink);box-shadow:0 5px 0 #D9A93A}
.center{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.big{font-size:clamp(3.5rem,10vmin,6rem);line-height:1}
.clear{font-family:var(--hand);font-size:clamp(1.3rem,3.6vmin,1.8rem);background:var(--butter2);border:2.5px solid var(--butter);border-radius:999px;padding:6px 22px}
.banner{font-family:var(--hand);font-size:clamp(1.1rem,3vmin,1.5rem);background:var(--butter2);border:2.5px solid var(--butter);border-radius:var(--wob);padding:10px 18px}
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2.5vmin,22px)}
.stk{--k:clamp(72px,14vmin,120px);font-size:calc(var(--k)*.55);width:var(--k);height:var(--k);border-radius:var(--wob);border:2.5px solid var(--ink);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 5px 0 var(--line)}
.stk.new{background:var(--butter2);border-color:#D9A93A}
.kirabig{font-size:clamp(4rem,12vmin,7rem);animation:spin 1.2s ease}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}to{transform:none}}

/* overlay confirm */
.veil{position:fixed;inset:0;background:rgba(74,58,46,.35);display:grid;place-items:center;padding:16px;z-index:5}
.dialog{padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}

/* day detail / parent */
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.facts span{font-family:var(--hand);background:#EAF1FA;border:2px solid var(--blue2);border-radius:999px;padding:4px 14px;font-size:1.1rem}
.parent{font-family:"Meiryo","Hiragino Sans",sans-serif;font-size:.95rem;line-height:1.8;max-width:62ch;-webkit-user-select:text;user-select:text}
.parent h2{font-family:var(--round);font-size:1.25rem;margin:0 0 6px}
.parent ul{margin:0;padding-left:1.2em}
.toggle{display:flex;align-items:center;gap:10px;font-size:1rem}
.toggle input{width:26px;height:26px}

/* landscape tablet: stage left, answers right */
@media (orientation:landscape) and (min-width:900px){
  .qs{grid-template-columns:1.15fr 1fr;grid-template-rows:1fr;align-items:center}
  .frames.two{flex-direction:column;--c:clamp(26px,min(7.4vh,4.6vw),64px)}
  .frames{--c:clamp(34px,min(10vh,6vw),88px)}
  .home{grid-template-columns:auto 1fr;align-items:start}
  .home .homehead{grid-column:1/-1}
}
.q,.bubble,.tile .t,.banner,.clear,.iname,.pbtn,.top h1{word-break:keep-all;overflow-wrap:anywhere}
/* vertical centering + celebratory screens */
.qs{align-content:center}
.center{flex:1;justify-content:center}
.coach.hero{justify-content:center}
.coach.hero .bear{width:clamp(110px,20vmin,190px)}
.coach.hero .bubble{flex:0 1 auto;max-width:520px}
@media (orientation:portrait) and (min-height:900px){
  .frames.two{flex-direction:column;--c:clamp(26px,min(11vw,6.6vh),80px)}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .tile{min-height:76px}
}
#card .nextbtn{display:block;margin:clamp(14px,2.4vh,24px) auto 0;font-size:clamp(1.3rem,3.8vmin,1.9rem);padding:12px 40px;animation:popin .35s ease}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* v8 question layout: equation first, ぽっけ asks, answers, hint panel */
.qs{display:grid;grid-template-columns:1fr;gap:clamp(12px,2vh,20px);align-content:start}
.qmain{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,18px)}
.eq{display:flex;align-items:flex-start;justify-content:center;gap:.28em;font-size:clamp(3rem,10vmin,6rem);line-height:1.05;letter-spacing:0;white-space:nowrap}
.tok{display:flex;flex-direction:column;align-items:center;min-width:.62em}
.tok .v{font-family:var(--hand)}
.tok.op .v{font-family:var(--round);font-weight:700;font-size:.82em;line-height:1.28}
.tok.r .v{color:var(--red)} .tok.b .v{color:var(--blue)}
.tok.answered .v{color:var(--ok)}
.cherry{position:relative;width:3.1em;font-size:.48em;margin-top:.08em}
.cherry svg{display:block;width:62%;height:.8em;margin:0 auto}
.cherry path{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.slots{display:flex;justify-content:space-between}
.slot{width:1.3em;height:1.3em;font-size:.92em;border-radius:50%;border:3px solid var(--ink);background:var(--card);display:grid;place-items:center;font-family:var(--hand);color:var(--soft);font-size:1em;line-height:1}
.slot.now{box-shadow:0 0 0 5px var(--butter2),0 0 0 8px var(--butter);color:var(--ink)}
.slot.filled{color:var(--ink);border-color:var(--ok)}
.slot.pending{border-style:dashed;border-color:var(--red);background:#FFF6F2}
.slot.ten{border-color:var(--red);color:var(--red)}
.tok.focus > .v{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em;text-decoration-color:var(--butter)}
.eq{position:relative}
.eq.haslink{padding-bottom:.75em}
.eq svg.link{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.slot.mem{background:repeating-linear-gradient(45deg,var(--butter2) 0 6px,#fff 6px 12px);border-style:dashed}
.cherry.stem{width:1.6em}
.cherry.stem .slots{justify-content:center}
.stemlabel{display:block;text-align:center;font-family:var(--hand);font-size:.62em;color:var(--blue);margin-top:.15em}
.tok.b .slot.filled{border-color:var(--blue)}
.radio{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:1rem}
.radio label{display:flex;align-items:center;gap:8px}
.radio input{width:22px;height:22px}
.coach.ask{min-height:0;max-width:640px}
.coach.ask .bear{width:clamp(70px,11vmin,104px)}
.coach.ask .bubble{font-size:clamp(1.2rem,3.4vmin,1.75rem);margin-bottom:14px}
.area{display:flex;flex-direction:column;align-items:center}
.hint{width:100%;max-width:640px;margin:0 auto;box-sizing:border-box;border:2.5px dashed var(--line);border-radius:var(--wob);padding:8px 12px 12px;background:rgba(255,252,245,.55)}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hlabel{font-family:var(--hand);color:var(--soft);font-size:1.05rem}
.hbtn{font-family:var(--hand);font-size:1.15rem;border:2.5px solid var(--ink);border-radius:999px;padding:6px 18px;background:var(--butter2);cursor:pointer}
.hbody{display:none;padding-top:8px}
.hint.open .hbody{display:block}
.hint.open{border-style:solid;border-color:var(--line);background:rgba(255,252,245,.8)}
.hint .frames{--c:clamp(24px,min(7.4vw,4.4vh),54px)}
.hint .frames.two{--c:clamp(22px,min(calc((100vw - 190px)/10.6),4.2vh),48px);flex-direction:row}
.pack{display:flex;flex-direction:column;align-items:center;gap:2px}
.plabel{font-family:var(--hand);font-size:1.1rem;color:var(--soft)}
.qmain .hidebox{min-height:calc(var(--c)*2.6)}
@media (orientation:landscape) and (min-width:900px){
  .qs.withhint{grid-template-columns:1.15fr .85fr;align-items:center;align-content:center}
  .qs:not(.withhint){max-width:760px;margin:0 auto;width:100%}
  .hint .frames.two{flex-direction:column;--c:clamp(22px,min(6.4vh,3.6vw),52px)}
  .hint .frames{--c:clamp(24px,min(8vh,4.4vw),60px)}
}
/* v14 */
.abtn.wrong{opacity:.32;position:relative;box-shadow:none}
.abtn.wrong::after{content:"×";position:absolute;right:8%;top:2%;font-size:.5em;color:var(--red)}
.slot.later,.cherry.later{visibility:hidden}
.homehead{display:flex;flex-direction:column;gap:10px}
.sdots{display:flex;gap:10px;justify-content:center;min-height:16px}
.sdots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);background:var(--card)}
.sdots i.d{background:var(--sage);border-color:#6E9461}
.sdots i.c{background:var(--butter);border-color:#D9A93A}
.qsub{font-family:var(--hand);color:var(--soft);margin:0;text-align:center}
.pstat,.pbackup{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.ptable{border-collapse:collapse;font-size:.92rem}
.ptable td{border-bottom:1px solid var(--line);padding:4px 8px 4px 0}
.code{width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:.8rem;border:2px solid var(--line);border-radius:10px;padding:6px;background:#fff;-webkit-user-select:text;user-select:text}
.pbtn.small{font-size:1rem;padding:6px 16px;align-self:flex-start}
.warn{background:#FFF0EA;border:2px solid var(--red);border-radius:10px;padding:8px 10px;margin:0}
.pmsg{min-height:1.2em;margin:0;color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
</svg>

<div id="app">
  <header class="top" id="top"></header>
  <main id="card"></main>
</div>

<script>
const card=document.getElementById('card'), top_=document.getElementById('top');
const KEY='sosuke-tashizan-v2';
// order = unlock order. A mode opens when the previous one was cleared (4+/5 first-try) on 2 different days
const MODES=[
  {id:'see',   title:'ぱっと みて いくつ？', icon:[[7,'r']]},
  {id:'ten',   title:'10の なかよし',       icon:[[6,'r']]},
  {id:'add10', title:'10までの たしざん',    icon:[[3,'r'],[4,'b']]},
  {id:'sub10', title:'10までの ひきざん',    icon:[[4,'r'],[3,'x']]},
  {id:'make',  title:'10を つくって たす',   icon:[[8,'r'],[2,'b']]},
  {id:'borrow',title:'10から ひく ひきざん', icon:[[6,'r'],[4,'x']]},
];
const MODE_NAME=Object.fromEntries(MODES.map(m=>[m.id,m.title]));
const NEED_DAYS=2, CLEAR_AT=4;
function clearDays(id){return new Set(S.days.filter(d=>d.rounds&&d.rounds.some(r=>r.mode===id&&r.first>=CLEAR_AT)).map(d=>d.date)).size}
function isOpen(i){return i===0||S.allOpen||clearDays(MODES[i-1].id)>=NEED_DAYS}
function openSet(){return MODES.filter((m,i)=>isOpen(i)).map(m=>m.id)}
const ISLANDS=[
  {name:'はじまりの しま', add:['🐶','🐱','🚗','🚃','⚽','🍎','🌟','🦖']},
  {name:'もりの しま',     add:['🦁','🐿️']},
  {name:'うみの しま',     add:['🐳','🐙']},
  {name:'そらの しま',     add:['🚀','🛸']},
  {name:'まちの しま',     add:['🚒','🚓']},
  {name:'おかしの しま',   add:['🍙','🍦']},
  {name:'ほしの しま',     add:['🌈','🏆']},
];
const KIRA=['💎','👑','🏅','🎖️','🔮','🪐','🌠'];
const PER=10;

let S={level:{},days:[],voice:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function jpDate(s){const [y,m,d]=s.split('-');return (+m)+'がつ '+(+d)+'にち'}
const stuck=()=>S.days.filter(d=>d.sticker);
function today(){return S.days.find(d=>d.date===todayStr())}
function unlocked(){const n=stuck().length;const upto=Math.min(Math.floor(n/PER),ISLANDS.length-1);let a=[];for(let i=0;i<=upto;i++)a=a.concat(ISLANDS[i].add);return a}
function newOnes(){const n=stuck().length;const i=Math.min(Math.floor(n/PER),ISLANDS.length-1);return i>0?ISLANDS[i].add:[]}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function choices(ans,lo=0,hi=10){
  const s=new Set([ans]);
  for(const v of shuffle([ans-1,ans+1,ans-2,ans+2]).filter(v=>v>=lo&&v<=hi)){if(s.size<3)s.add(v)}
  while(s.size<3)s.add(rnd(lo,hi));
  return shuffle([...s]);
}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

/* ---------- voice ----------
   Recorded human-voice clips (voice/NN.m4a) are used when listed in CLIPS; anything else falls back
   to the iPad's system voice. On-screen text keeps the numbers; the clips are number-free prompts. */
const CLIPS={see:'/tashizan/voice/01.mp3',ten:'/tashizan/voice/02.mp3',sum:'/tashizan/voice/03.mp3',left:'/tashizan/voice/04.mp3',
  make1:'/tashizan/voice/07.mp3',make2:'/tashizan/voice/08.mp3',make3:'/tashizan/voice/09.mp3',
  borrow1:'/tashizan/voice/10b.mp3',borrow2:'/tashizan/voice/11b.mp3',borrow3:'/tashizan/voice/12.mp3'};
let lastSay='',lastClip='',curAudio=null;
function playClip(id,fallback,onEnd){
  lastClip=id;lastSay=fallback;
  let fired=false;const fin=()=>{if(!fired){fired=true;onEnd&&onEnd()}};
  if(onEnd)setTimeout(fin,6000);           // safety: never wait forever
  if(!S.voice){if(onEnd)setTimeout(fin,300);return}
  const url=CLIPS[id];
  if(!url){say(fallback,fin);return}
  try{speechSynthesis.cancel()}catch(e){}
  try{if(curAudio){curAudio.pause()}const au=new Audio(url);curAudio=au;au.onended=fin;au.onerror=fin;au.play().catch(e=>{if(au===curAudio&&e&&e.name!=='AbortError')say(fallback,fin);else fin()})}catch(e){say(fallback,fin)}
}
/* tiny sound effects (Web Audio, no files). Start only from a tap, as iPad requires. */
let AC=null;
function sfx(kind){
  if(S.sfx===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;const notes=kind==='ok'?[[784,0],[1047,.1]]:[[330,0],[262,.12]];
    notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='ok'?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(kind==='ok'?.2:.12,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.28);
      o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.32)});
  }catch(e){}
}
function replay(){if(lastClip&&CLIPS[lastClip])playClip(lastClip,lastSay);else say(lastSay)}
function say(t,onEnd){
  if(!t)return;
  if(!S.voice){onEnd&&onEnd();return}
  try{
    const s=t.replace(/−/g,' ひく ').replace(/\+/g,' たす ').replace(/=/g,' は ').replace(/[?？]/g,'').replace(/□/g,'なに');
    const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.9;u.pitch=1.1;if(onEnd){u.onend=onEnd;u.onerror=onEnd}
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){onEnd&&onEnd()}
}

/* ---------- ten-frame ---------- */
// parts = [[count,'r'|'b'|'x'], ...] filled in order; x = taken away
function frameG(parts,{hintEmpty=false,pop='',mini=false,target=false}={}){
  const f=el('div','tf'+(mini?' mini':'')+(target?' target':''));const seq=[];
  parts.forEach(([n,c])=>{for(let k=0;k<n;k++)seq.push(c)});
  for(let i=0;i<10;i++){
    const c=el('div','cell');
    if(i<seq.length){c.innerHTML='<div class="dot '+seq[i]+(seq[i]===pop?' pop':'')+'" style="--i:'+i+'"></div>'}
    else if(hintEmpty){c.classList.add('hint');c.innerHTML='<span class="n">'+(i-seq.length+1)+'</span>'}
    f.appendChild(c);
  }
  return f;
}

/* ---------- island board ---------- */
function islandView({highlightToday=false,placedIdx=-1}={}){
  const all=stuck();const n=all.length;
  const isl=Math.min(Math.floor((placedIdx>=0?placedIdx:n)/PER),ISLANDS.length-1);
  const box=el('div','island');
  const kira=isl>0?'<span>'+KIRA[isl-1]+'</span>':'';
  box.appendChild(el('div','iname',kira+ISLANDS[isl].name+' <span class="pill">'+n+'にち</span>'));
  const b=el('div','board');
  const t=today();const todayDone=t&&t.sticker;
  for(let k=0;k<PER;k++){
    const idx=isl*PER+k;const d=all[idx];
    const sq=el('button','sq');sq.type='button';sq.id='sq-'+idx;
    if(d){
      sq.classList.add('done');sq.innerHTML=d.sticker+(d.hana?'<span class="hana">💮</span>':'');
      sq.setAttribute('aria-label',jpDate(d.date));sq.onclick=()=>dayDetail(d);
      if(idx===placedIdx)sq.classList.add('placed');
    }else{
      sq.innerHTML='<span class="num">'+(idx+1)+'</span>';sq.disabled=true;
      if(highlightToday&&!todayDone&&idx===n)sq.classList.add('today');
    }
    b.appendChild(sq);
  }
  box.appendChild(b);
  const ib=el('div','isles');ISLANDS.forEach((_,i)=>ib.appendChild(el('i',i<isl?'d':i===isl?'c':'')));box.appendChild(ib);
  return box;
}

/* ---------- home ---------- */
function recIndex(){let r=0;MODES.forEach((m,i)=>{if(isOpen(i))r=i});return r}
function home(){
  topbar('home');card.innerHTML='';
  const t=today();const wrap=el('div','home');
  const left=el('div','');left.appendChild(islandView({highlightToday:true}));
  const right=el('div','tiles');const rec=recIndex();
  MODES.forEach((md,i)=>{

    const no=el('span','no',String(i+1));

  if(rs){const go=el('button','pbtn','つづきから（'+(rs.i+1)+'もんめ）');go.id='resume';go.onclick=()=>{R={mode:rs.mode,i:rs.i,n:rs.n,first:rs.first,missRun:rs.missRun,okRun:rs.okRun,facts:rs.facts||[]};next()};co.btn=go}
  if(t&&!t.sticker&&!co.btn){const go=el('button','pbtn sun','シールを えらぶ');go.id='go-sticker';go.onclick=stickerPick;co.btn=go}
  const head=el('div','homehead');head.appendChild(co);if(co.btn){const r=el('div','row');r.appendChild(co.btn);head.appendChild(r)}
  wrap.append(head,left,right);card.appendChild(wrap);

/* ---------- round ----------
   Screen order follows how a child solves: equation → ぽっけ asks → answer → (hint).
   The hint panel (dots) stays hidden until the first miss — so dots can't replace thinking — and is shown
   after a correct answer as 答え合わせ. A wrong choice is disabled; after 2 misses the choices are re-rolled
   so the last remaining button can't be "found" by elimination. Any miss = not 「ひとりで」. */
let R=null, ST=null, AR=null, CO=null, HP=null, SD=null, QS=null;
function start(mode){R={mode,i:0,n:5,first:0,missRun:0,okRun:0,facts:[]};S.resume=null;next()}
function easyQ(){return R.i===0||R.i===R.n-1}
function lvl(){return easyQ()?0:S.level[R.mode]}
const MEM_MODES=['make','borrow'];
function done(miss,fact){
  if(miss===0){R.first++;R.facts.push(fact);R.okRun++;R.missRun=0}
  else{R.missRun++;R.okRun=0}
  if(!easyQ()){
    if(R.missRun>=2){S.level[R.mode]=Math.max(1,S.level[R.mode]-1);R.missRun=0}
    if(R.okRun>=2&&S.level[R.mode]<3){S.level[R.mode]++;R.okRun=0}
    // 「おぼえて計算」は、むずかしいで 2回つづけて ひとりで正解してから
    if(MEM_MODES.includes(R.mode)){
      S.memStreak=S.memStreak||{};
      S.memStreak[R.mode]=(S.level[R.mode]>=3&&miss===0)?(S.memStreak[R.mode]||0)+1:0;
    }
  }
  R.i++;save();next();
}
function hintPanel(){
  const p=el('section','hint');p.setAttribute('aria-label','ヒント');p.hidden=true;
  const head=el('div','hhead','<span class="hlabel">💡 ヒント</span>');
  const body=el('div','hbody');p.append(head,body);
  p.open=()=>{if(p.never)return;p.hidden=false;p.classList.add('open');QS&&QS.classList.add('withhint')};
  p.close=()=>{p.hidden=true;p.classList.remove('open');QS&&QS.classList.remove('withhint')};
  p.set=(...nodes)=>{body.innerHTML='';nodes.forEach(n=>body.appendChild(n))};
  p.frames=()=>body.querySelector('.frames');
  return p;
}
function stepTo(i){
  if(!SD)return;SD.innerHTML='';
  if(R.steps<=1){SD.hidden=true;return}
  SD.hidden=false;
  for(let k=0;k<R.steps;k++)SD.appendChild(el('i',k<i?'d':k===i?'c':''));
}
function next(){
  if(R.i>=R.n)return finish();
  S.resume={mode:R.mode,i:R.i,n:R.n,first:R.first,missRun:R.missRun,okRun:R.okRun,facts:R.facts,date:todayStr()};save();
  R.steps={make:3,borrow:3}[R.mode]||1;
  topbar('q');card.innerHTML='';
  QS=el('div','qs');const main=el('div','qmain');
  ST=el('div','stage');SD=el('div','sdots');CO=coach('normal','',false);CO.classList.add('ask');AR=el('div','area');HP=hintPanel();
  main.append(ST,SD,CO,AR);QS.append(main,HP);card.appendChild(QS);
  stepTo(0);
  ({see:qSee,ten:qTen,add10:qAdd10,sub10:qSub10,make:qMake,borrow:qBorrow})[R.mode]();
}
// the question is what ぽっけ says (keep it to one short line; the voice can say more)
function setQ(t,speech,clip='',onEnd){CO.set('normal',t,'');playClip(clip,speech||t,onEnd)}
// equation builder. tokens: {t,c:'r'|'b',op,cherry:[x,y],stem}
function EQ(tokens){
  const e=el('div','eq');
  tokens.forEach(tk=>{
    const d=el('div','tok'+(tk.op?' op':'')+(tk.c?' '+tk.c:''));d.appendChild(el('span','v',tk.t));
    if(tk.cherry){
      const c=el('div','cherry','<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 L22 30 M50 0 L78 30"/></svg>');
      const sl=el('div','slots');tk.slots=tk.cherry.map(v=>{const s=el('span','slot',String(v));sl.appendChild(s);return s});
      c.appendChild(sl);d.appendChild(c);tk.cherryEl=c;
    }
    if(tk.stem){
      const c=el('div','cherry stem','<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 L50 30"/></svg>');
      const sl=el('div','slots');const s1=el('span','slot'+(tk.stemEmpty?' pending':''),tk.stemEmpty?'':'?');sl.appendChild(s1);tk.slots=[s1];
      c.append(sl,el('span','stemlabel',tk.stem));d.appendChild(c);tk.stemEl=c;
    }
    tk.el=d;e.appendChild(d);
  });
  e.tk=tokens;return e;
}
function drawLink(e,from,to){
  const NS='http://www.w3.org/2000/svg';const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','link');
  e.classList.add('haslink');e.appendChild(svg);
  const upd=()=>{
    if(!document.body.contains(svg))return window.removeEventListener('resize',upd);
    const er=e.getBoundingClientRect(),f=from.getBoundingClientRect(),t=to.getBoundingClientRect();
    const x1=f.left+f.width/2-er.left,y1=f.bottom-er.top+2,x2=t.left+t.width/2-er.left,y2=t.bottom-er.top+4,h=Math.max(30,er.height*.2);
    svg.innerHTML=`<defs><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4F84C4"/></marker></defs>
      <path d="M${x1} ${y1} C ${x1} ${y1+h}, ${x2} ${y2+h}, ${x2} ${y2}" fill="none" stroke="#4F84C4" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah)"/>`;
  };
  requestAnimationFrame(upd);setTimeout(upd,300);window.addEventListener('resize',upd);
  return svg;
}
function slotNow(tk,i){tk.slots.forEach((s,k)=>s.classList.toggle('now',k===i))}
function slotSet(tk,i,v){const s=tk.slots[i];s.textContent=v;s.classList.remove('now','mem','later');s.classList.add('filled')}
function setAns(e,v){const t=e.tk[e.tk.length-1];t.el.querySelector('.v').textContent=v;t.el.classList.add('answered')}
// ask: praise names the strategy, not the child
function ask(ans,lo,hi,praise,onOk,{hint,reveal}={}){
  let miss=0;
  const render=()=>{
    AR.innerHTML='';const box=el('div','answers');
    choices(ans,lo,hi).forEach((v,k)=>{
      const b=el('button','abtn',v);b.type='button';b.id='ans-'+k;
      b.onclick=()=>{
        if(v===ans){
          sfx('ok');
          b.classList.add('ok');box.querySelectorAll('button').forEach(x=>x.disabled=true);
          if(reveal)reveal();
          HP.open();
          const fr=HP.frames();if(fr){fr.classList.remove('yay');void fr.offsetWidth;fr.classList.add('yay')}

/* さくらんぼの数字を「おぼえて」計算するモード.
   S.cherryMode: 'auto' | 'show' | 'hide'. auto は「むずかしい」で 2回つづけて ひとりで正解してから隠す.
   隠すときは、前のステップで答えた数字を伏せ、問いかけの文からも数字を外す. 易しい問題では隠さない. */
function memMode(){
  const m=S.cherryMode||'auto';if(easyQ()||m==='show')return false;if(m==='hide')return true;
  return S.level[R.mode]>=3&&((S.memStreak||{})[R.mode]||0)>=2;
}
function slotHide(tk,i){const s=tk.slots[i];s.textContent='';s.classList.remove('filled');s.classList.add('mem');s.title='おぼえてる？'}

/* 4: くりあがり（さくらんぼ計算）. The bigger number becomes 10: always RED; the smaller one BLUE splits.
   Only what the current step needs is shown: step1 = left cherry slot + arrow to the red「10」,
   step2 = right slot, step3 = 10 と right slot. */
function qMake(){
  const L=lvl();let x,y;
  if(L===0){x=9;y=rnd(2,3)}
  else if(L===1){x=9;y=rnd(2,6)}
  else if(L===2){x=rnd(8,9);y=rnd(11-x,7)}
  else{x=rnd(6,9);y=rnd(11-x,9)}
  const swap=L===0?false:L===1?Math.random()<.3:Math.random()<.5;
  const a=swap?Math.min(x,y):Math.max(x,y), b=swap?Math.max(x,y):Math.min(x,y);
  const tFirst=a>=b, T=tFirst?a:b, G=tFirst?b:a;
  const need=10-T,rest=G-need;let total=0;const mem=memMode();
  const tA={t:a,c:tFirst?'r':'b'},tB={t:b,c:tFirst?'b':'r'};
  const g=tFirst?tB:tA, rT=tFirst?tA:tB;   // g = blue (split), rT = red (becomes 10)
  g.cherry=['?','?'];rT.stem=' ';rT.stemEmpty=true;
  const e=EQ([tA,{t:'+',op:true},tB,{t:'=',op:true},{t:'?'}]);ST.appendChild(e);
  g.slots[1].classList.add('later');
  const arrow=drawLink(e,g.slots[0],rT.slots[0]);
  const draw=(tp,gp,opt={})=>{
    const f=el('div','frames two');
    const tf=frameG(tp,Object.assign({target:true},opt)), gf=frameG(gp);
    if(tFirst)f.append(tf,gf);else f.append(gf,tf);
    HP.set(f);
  };
  draw([[T,'r']],[[G,'b']]);
  slotNow(g,0);stepTo(0);
  setQ(`あかい ${T}は あと いくつで 10？`,`${a} たす ${b}。 あかい ${T}は、あと いくつで 10に なる`,'make1');
  ask(need,0,10,`10まで あと ${need}！`,m=>{total+=m;step2()},{
    hint:m=>{draw([[T,'r']],[[G,'b']],{hintEmpty:true});m.textContent='きいろの へやを かぞえてね'},
    reveal:()=>{slotSet(g,0,need);const r=rT.slots[0];r.classList.remove('pending');r.classList.add('filled','ten');r.textContent='10';draw([[T,'r'],[need,'b']],[[rest,'b']],{pop:'b'})}});
  function step2(){
    HP.close();stepTo(1);arrow.remove();
    if(mem)slotHide(g,0);
    g.slots[1].classList.remove('later');slotNow(g,1);
    setQ(mem?`あおい ${G}は さっきの かずと いくつ？`:`あおい ${G}は ${need}と いくつ？`,
         mem?`あおい ${G}は、さっきの かずと いくつに わけられる`:`あおい ${G}は、${need}と いくつに わけられる`,'make2');
    ask(rest,0,10,`${G}は ${need}と ${rest}！`,m=>{total+=m;step3()},{
      hint:m=>{m.textContent='のこった あおい まるは？'},
      reveal:()=>{slotSet(g,1,rest);if(mem)g.slots[0].textContent=need}});
  }
  function step3(){
    HP.close();stepTo(2);
    if(mem){slotHide(g,0);slotHide(g,1)}
    g.slots[1].classList.add('now');rT.slots[0].classList.add('now');
    setQ(mem?'10と みぎの まるで いくつ？':`10と ${rest}で いくつ？`,'','make3');
    ask(10+rest,10,18,`10と ${rest}で ${10+rest}！`,m=>{total+=m;done(total,`${a}+${b}`)},{
      hint:m=>{m.textContent='10の つぎは 11、12…'},
      reveal:()=>{g.slots[1].classList.remove('now');rT.slots[0].classList.remove('now');slotSet(g,0,need);slotSet(g,1,rest);setAns(e,a+b)}});
  }
}

/* 5: くりさがり（減加法）. 13−5: 13 = 10 と 3（赤のさくらんぼ）→ 10 から 5 をとる（青の下に「のこり」）
   → のこり と 3 をあわせる. 青の「のこり」は step2 から出し、最後まで赤と一緒に表示. */
function qBorrow(){
  const L=lvl();let a,b;
  if(L===0){a=rnd(11,12);b=9}
  else if(L===1){b=rnd(8,9);a=rnd(11,10+b-1)}
  else if(L===2){b=rnd(6,9);a=rnd(11,10+b-1)}
  else{b=rnd(2,9);a=rnd(11,Math.min(18,10+b-1))}
  const ones=a-10,left=10-b,ans=left+ones;let total=0,knowOnes=false;const mem=memMode();
  const tA={t:a,c:'r',cherry:['10','?']};
  const tB={t:b,c:'b',stem:'のこり'};
  const e=EQ([tA,{t:'−',op:true},tB,{t:'=',op:true},{t:'?'}]);ST.appendChild(e);
  tB.stemEl.classList.add('later');
  const draw=(taken,opt={})=>{
    const f=el('div','frames two');
    const p=el('div','pack'),l=el('div','pack');
    p.append(frameG(taken?[[left,'r'],[b,'x']]:[[10,'r']],Object.assign({target:true},opt)),el('span','plabel','10'));
    l.append(frameG([[ones,'r']]),el('span','plabel',knowOnes?String(ones):'？'));
    f.append(p,l);HP.set(f);
  };
  draw(false);
  slotNow(tA,1);stepTo(0);
  setQ(`あかい ${a}は 10と いくつ？`,`${a} ひく ${b}。 あかい ${a}は、10と いくつに わけられる`,'borrow1');
  ask(ones,0,10,`${a}は 10と ${ones}！`,m=>{total+=m;step2()},{
    hint:m=>{m.textContent='10の となりの まるは？'},
    reveal:()=>{knowOnes=true;slotSet(tA,1,ones);draw(false)}});
  function step2(){
    HP.close();stepTo(1);
    if(mem)slotHide(tA,1);
    tB.stemEl.classList.remove('later');
    tA.slots[0].classList.add('now');slotNow(tB,0);
    setQ(`10から あおい ${b}を とると？`,`あおい ${b}を、10から とると、いくつ のこる`,'borrow2');
    ask(left,0,10,`10から ${b} とって ${left}！`,m=>{total+=m;step3()},{
      hint:m=>{draw(true);m.textContent='×じゃない あかい まるは？'},
      reveal:()=>{tA.slots[0].classList.remove('now');slotSet(tB,0,left);draw(true,{pop:'x'})}});
  }
  function step3(){
    HP.close();stepTo(2);
    if(mem){slotHide(tA,1);slotHide(tB,0)}
    tA.slots[1].classList.add('now');tB.slots[0].classList.add('now');
    setQ(mem?'のこりと みぎの まるで いくつ？':`${left}と ${ones}で いくつ？`,'','borrow3');
    ask(ans,0,10,`${left}と ${ones}で ${ans}！`,m=>{total+=m;done(total,`${a}−${b}`)},{
      hint:m=>{draw(true);m.textContent='×じゃない あかい まるを ぜんぶ'},
      reveal:()=>{slotSet(tA,1,ones);slotSet(tB,0,left);setAns(e,ans)}});
  }
}

  const bk=el('div','pbackup','<b>記録のバックアップ</b>');
  if(!standalone)bk.appendChild(el('p','warn','⚠ ホーム画面のアイコンから開いていません。iPadのSafariは、7日間使わなかったサイトの記録を消すことがあります。Safariの共有ボタン →「ホーム画面に追加」で追加し、そこから開いてください。'));
  bk.appendChild(el('p','','記録（シール・はなまる・難しさ）を文字のかたまりにして控えておけます。メモアプリやLINEのKeepなどに貼って保存してください。'));
  const out=el('textarea','code');out.id='backup-out';out.readOnly=true;out.rows=3;out.placeholder='「記録をコピー」を押すとここに出ます';
  const cp=el('button','pbtn sub small','記録をコピー');cp.id='backup-copy';
  cp.onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({},S,{offset:undefined})))));out.value=code;out.select();
    try{navigator.clipboard.writeText(code).then(()=>{cp.textContent='コピーしました'},()=>{cp.textContent='上の文字を長押しでコピー'})}catch(e){cp.textContent='上の文字を長押しでコピー'}};
  const inp=el('textarea','code');inp.id='backup-in';inp.rows=3;inp.placeholder='控えておいた文字をここに貼り付け';
  const msg=el('p','pmsg','');
  const rs=el('button','pbtn sub small','この記録にもどす');rs.id='backup-restore';
  rs.onclick=()=>{let d;try{d=JSON.parse(decodeURIComponent(escape(atob(inp.value.trim()))))}catch(e){msg.textContent='文字が正しくありません。コピーした文字をそのまま貼り付けてください。';return}
    if(!d||!Array.isArray(d.days)){msg.textContent='記録の形が正しくありません。';return}
    if(rs.dataset.armed!=='1'){rs.dataset.armed='1';rs.textContent='本当にもどす（今の記録は上書き）';msg.textContent='シール '+d.days.filter(x=>x.sticker).length+'枚の記録です。もう一度押すと、今の記録と入れかわります。';return}
    S=Object.assign({level:{},days:[],voice:true},d);MODES.forEach(m=>{if(!S.level[m.id])S.level[m.id]=1});save();msg.textContent='記録をもどしました。';rs.dataset.armed='';rs.textContent='この記録にもどす'};
  bk.append(cp,out,inp,rs,msg);p.appendChild(bk);
  const ex=el('div','');ex.id='parent-extra';p.appendChild(ex);
  card.appendChild(p);
  const back=el('button','pbtn sub','もどる');back.id='parent-back';back.onclick=home;
  const r=el('div','row');r.appendChild(back);card.appendChild(r);
}

home();
</script>
